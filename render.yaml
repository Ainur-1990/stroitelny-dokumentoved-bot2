services:
  - type: web
    name: construction-doc-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: BYOK_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_ENDPOINT
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: POLLING_MODE
        value: "false"
